# Samudra Option A — EC2 + Docker Compose
# Run from repo root:  docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
#
# API traffic (recommended): Browser / SPA → Kong :8000/v1/* → backend:8080
# Optional direct backend: localhost:8080 (not exposed by default in this compose file)

services:
  postgres:
    image: postgres:16-alpine
    container_name: samudra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: samudra-marketPlace
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d samudra-marketPlace']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - samudra

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: samudra-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: samudra-local-kafka-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - samudra

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: samudra-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/samudra-marketPlace
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SAMUDRA_JWT_SECRET: ${SAMUDRA_JWT_SECRET:?Set SAMUDRA_JWT_SECRET in docker/.env}
      SAMUDRA_OAUTH_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SAMUDRA_CORS_ALLOWED_ORIGIN_PATTERNS: ${SAMUDRA_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      SAMUDRA_EVENTS_KAFKA_ENABLED: 'true'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SAMUDRA_INTERNAL_API_TOKEN: ${SAMUDRA_INTERNAL_API_TOKEN:-samudra-internal-dev}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - samudra

  integration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.integration
    container_name: samudra-integration
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SAMUDRA_CORE_BASE_URL: http://backend:8080
      SAMUDRA_INTERNAL_API_TOKEN: ${SAMUDRA_INTERNAL_API_TOKEN:-samudra-internal-dev}
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - samudra

  kong:
    image: kong:3.8
    container_name: samudra-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - '${KONG_PROXY_PORT:-8000}:8000'
      - '${KONG_ADMIN_PORT:-8001}:8001'
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      - backend
    networks:
      - samudra

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID in docker/.env}
        VITE_API_BASE_URL: ''
    container_name: samudra-frontend
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - kong
      - backend
    networks:
      - samudra

volumes:
  postgres_data:

networks:
  samudra:
    driver: bridge
