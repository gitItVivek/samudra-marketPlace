# Samudra Option A — EC2 + Docker Compose (+ Kafka + integration on feature branch)
# Run from repo root:  COMPOSE_BAKE=false docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: samudra-postgres
    restart: unless-stopped
    profiles: ['local-db']
    environment:
      POSTGRES_DB: samudra-marketPlace
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Only used with --profile local-db; RDS-only runs do not need POSTGRES_PASSWORD in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d samudra-marketPlace']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - samudra

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: samudra-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: samudra-local-kafka-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - samudra

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: samudra-kafka-ui
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '${KAFKA_UI_PORT:-8090}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: samudra-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - samudra

  redis:
    image: redis:7-alpine
    container_name: samudra-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - samudra

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: samudra-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in docker/.env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in docker/.env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in docker/.env}
      SAMUDRA_JWT_SECRET: ${SAMUDRA_JWT_SECRET:?Set SAMUDRA_JWT_SECRET in docker/.env}
      SAMUDRA_OAUTH_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SAMUDRA_CORS_ALLOWED_ORIGIN_PATTERNS: ${SAMUDRA_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      SAMUDRA_EVENTS_KAFKA_ENABLED: 'true'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SAMUDRA_INTERNAL_API_TOKEN: ${SAMUDRA_INTERNAL_API_TOKEN:-samudra-internal-dev}
      SPRING_FLYWAY_REPAIR_ON_MIGRATE: ${SPRING_FLYWAY_REPAIR_ON_MIGRATE:-true}
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:-false}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SAMUDRA_CACHE_REDIS_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    # API only on Docker network — browser hits nginx frontend, which proxies /v1 → backend:8080
    networks:
      - samudra

  integration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.integration
    container_name: samudra-integration
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SAMUDRA_CORE_BASE_URL: http://backend:8080
      SAMUDRA_INTERNAL_API_TOKEN: ${SAMUDRA_INTERNAL_API_TOKEN:-samudra-internal-dev}
      SAMUDRA_DIGEST_AGGREGATION_MS: ${SAMUDRA_DIGEST_AGGREGATION_MS:-60000}
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - samudra

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID in docker/.env}
        VITE_API_BASE_URL: ''
    container_name: samudra-frontend
    restart: unless-stopped
    ports:
      # Single public entry: SPA + /v1 API proxy (no direct backend/integration ports on host)
      - '${HTTP_PORT:-5173}:80'
    depends_on:
      - backend
      - integration
    networks:
      - samudra

volumes:
  postgres_data:

networks:
  samudra:
    driver: bridge
