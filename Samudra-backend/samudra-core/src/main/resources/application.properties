spring.application.name=samudra-core

# Default profile: sandbox (override on AWS: --spring.profiles.active=prod)
spring.profiles.default=sandbox

# PostgreSQL datasource (override via env or deploy profile)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/samudra-marketPlace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Kafka event publishing (disabled by default for local bootRun without Kafka)
samudra.events.kafka.enabled=${SAMUDRA_EVENTS_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Internal API token for samudra-integration → core HTTP calls
samudra.internal.api.token=${SAMUDRA_INTERNAL_API_TOKEN:}

