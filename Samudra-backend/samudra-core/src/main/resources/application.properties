spring.application.name=samudra-core

# Default profile: sandbox (override on AWS: --spring.profiles.active=prod)
spring.profiles.default=sandbox

# PostgreSQL datasource (override per profile if needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/samudra-marketPlace
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

