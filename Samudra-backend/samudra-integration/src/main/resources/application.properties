spring.application.name=samudra-integration
server.port=8081

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

samudra.core.base-url=${SAMUDRA_CORE_BASE_URL:http://localhost:8080}
samudra.internal.api.token=${SAMUDRA_INTERNAL_API_TOKEN:}
samudra.digest.aggregation-ms=${SAMUDRA_DIGEST_AGGREGATION_MS:60000}
samudra.digest.max-listings-per-digest=${SAMUDRA_DIGEST_MAX_LISTINGS:10}
samudra.digest.throttle-per-hour=${SAMUDRA_DIGEST_THROTTLE_PER_HOUR:2}

camel.springboot.main-run-controller=true
camel.component.kafka.brokers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.group-id=samudra-integration
camel.component.kafka.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,metrics,prometheus
